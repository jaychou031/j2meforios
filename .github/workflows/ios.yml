name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned source revision
        id: source
        run: |
          python3 -c 'import json; d=json.load(open("upstream.lock.json")); print("revision=" + d["commit"])' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: lucinhu/esp32s31-korvo-nano-j2me
          ref: ${{ steps.source.outputs.revision }}
          submodules: recursive
          path: upstream/esp32s31-korvo-nano-j2me
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Test portable input and layout
        run: |
          mkdir -p build
          clang++ -std=c++17 -Wall -Wextra -Werror tests/controls_test.cpp -o build/controls-test
          build/controls-test
          clang++ -std=c++17 -Wall -Wextra -Werror -DNJ_USE_LIBC=1 -Iupstream/esp32s31-korvo-nano-j2me/third_party/nano_j2me/include tests/input_queue_test.cpp -o build/input-queue-test
          build/input-queue-test
          mkdir -p build/tmp
          clang++ -std=c++17 -fobjc-arc -framework Foundation tests/storage_test.mm ios/GameStorage.mm -o build/storage-test
          build/storage-test build/tmp
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Build device application and package IPA
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-ios.sh 2>&1 | tee build-ios.log
          test -s dist/J2MEForIOS-unsigned.ipa
      - name: Run actual core demo and persistence smoke test
        run: |
          cmake -S tests/core -B build/core-host
          cmake --build build/core-host --target nj2me-cli --parallel 3
          python3 scripts/smoke-canvas.py build/core-host/core/nj2me
          python3 scripts/smoke-core.py build/core-host/core/nj2me
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: J2MEForIOS-unsigned-IPA
          path: dist/J2MEForIOS-unsigned.ipa
          if-no-files-found: error
      - name: Upload diagnostic logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: J2MEForIOS-build-logs
          path: |
            build-ios.log
            build/demo-boot-*.log
            build/canvas-compat.log
          if-no-files-found: warn
